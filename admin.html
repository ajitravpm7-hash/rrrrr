<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Studio – Manage artworks</title>
<style>:root{color-scheme:dark;--bg:#0e0b0c;--c:#1b1617;--r:#e50914;--m:#b0a6a2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f1ee;font:15px/1.5 system-ui,sans-serif;padding:16px;max-width:980px;margin:auto}
h1{color:var(--r);letter-spacing:.06em;margin:0 0 4px}p.h{color:var(--m);margin:0 0 16px}.bx{background:var(--c);border-radius:8px;padding:14px;margin-bottom:14px}
input,select,textarea{width:100%;background:#0e0b0c;color:inherit;border:1px solid #fff3;border-radius:5px;padding:8px;font:inherit}label{font-size:12px;color:var(--m)}
button{background:#fff;color:#000;border:0;border-radius:5px;padding:9px 14px;font-weight:600;cursor:pointer}button.g{background:#333;color:#fff}button.r{background:var(--r);color:#fff}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs .on{background:var(--r);color:#fff}
.it{display:grid;grid-template-columns:130px 1fr;gap:14px;background:var(--c);border-radius:8px;padding:12px;margin-bottom:12px}.it img,.it .ph{width:130px;height:130px;object-fit:cover;border-radius:6px;background:#333}
@media(max-width:600px){.it{grid-template-columns:1fr}}#msg{color:#7fe08f;margin-top:8px}</style></head><body>
<h1>STUDIO</h1><p class="h">Add or edit artworks, then click <b>Download website</b> and upload the ZIP to Netlify.</p>
<div class="bx"><div class="row"><div><label>WhatsApp number (with country code, digits only, e.g. 919876543210)</label><input id="wa"></div><div><label>Enquiry email</label><input id="em"></div></div></div>
<div class="tabs" id="tabs"></div><div id="list"></div>
<div class="bx"><button id="addp" class="r">+ Add photos</button> <input type="file" id="fi" accept="image/*" multiple hidden> <button class="g" id="rn">Rename category</button> <button class="g" id="dc">Delete category</button></div>
<div class="bx"><button id="dl" class="r">⬇ Download website (ZIP)</button><div id="msg"></div><p class="h">Then open <b>app.netlify.com/drop</b> and drop the ZIP (or Deploys → drag and drop). The site updates in a minute.</p></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={settings:{whatsapp:"",email:""},categories:[{id:"painting",n:"Painting",m:"Acrylic on canvas",h:14,s:78,items:[]},{id:"sketching",n:"Sketching",m:"Graphite and ink on paper",h:30,s:14,items:[]},{id:"digital",n:"Digital",m:"Digital illustration",h:282,s:80,items:[]},{id:"crafts",n:"Crafts",m:"Handmade, mixed materials",h:150,s:42,items:[]}]},ci=0;
const slug=t=>t.toLowerCase().replace(/\.[a-z0-9]+$/,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"art";
function draw(){const c=S.categories[ci];$("#wa").value=S.settings.whatsapp||"";$("#em").value=S.settings.email||"";
$("#tabs").innerHTML=S.categories.map((x,i)=>`<button class="${i==ci?"on":"g"}" data-t="${i}">${E(x.n)} (${x.items.length})</button>`).join("")+`<button class="g" id="nc">+ New category</button>`;
$("#list").innerHTML=c.items.map((it,i)=>`<div class="it"><div>${it.prev||it.img?`<img src="${it.prev||it.img}">`:'<div class="ph"></div>'}</div><div><div class="row"><div><label>Title</label><input data-k="title" data-i="${i}" value="${E(it.title)}"></div><div><label>Price (₹)</label><input type="number" data-k="price" data-i="${i}" value="${E(it.price)}"></div><div><label>Status</label><select data-k="status" data-i="${i}">${[["available","Available"],["sold","Sold"],["nfs","Not for sale"]].map(([v,l])=>`<option value="${v}" ${(it.status||"available")==v?"selected":""}>${l}</option>`).join("")}</select></div><div><label>Size (e.g. 18×24 in)</label><input data-k="size" data-i="${i}" value="${E(it.size)}"></div><div><label>Medium</label><input data-k="medium" data-i="${i}" value="${E(it.medium||c.m)}"></div><div><label>Year</label><input data-k="year" data-i="${i}" value="${E(it.year||new Date().getFullYear())}"></div></div><label>Description</label><textarea rows="2" data-k="desc" data-i="${i}">${E(it.desc)}</textarea><p><label><input type="checkbox" style="width:auto" data-k="featured" data-i="${i}" ${it.featured?"checked":""}> Show in Top 10</label> <button class="g" data-del="${i}">Delete</button></p></div></div>`).join("")||'<p class="h">No artworks here yet. Click “+ Add photos”.</p>'}
document.addEventListener("input",e=>{const t=e.target;if(t.id=="wa")S.settings.whatsapp=t.value.replace(/\D/g,"");else if(t.id=="em")S.settings.email=t.value;else if(t.dataset.k){S.categories[ci].items[t.dataset.i][t.dataset.k]=t.type=="checkbox"?t.checked:t.value}});
document.addEventListener("click",e=>{const t=e.target,c=S.categories[ci];if(t.dataset.t){ci=+t.dataset.t;draw()}else if(t.id=="nc"){const n=prompt("Category name?");if(n){S.categories.push({id:slug(n),n,m:"",h:Math.floor(Math.random()*360),s:60,items:[]});ci=S.categories.length-1;draw()}}else if(t.id=="rn"){const n=prompt("New name?",c.n);if(n){c.n=n;draw()}}else if(t.id=="dc"){if(S.categories.length>1&&confirm("Delete this category and its artworks?")){S.categories.splice(ci,1);ci=0;draw()}}else if(t.dataset.del){if(confirm("Delete this artwork?")){c.items.splice(+t.dataset.del,1);draw()}}else if(t.id=="addp")$("#fi").click()});
$("#fi").onchange=async e=>{const c=S.categories[ci];for(const f of e.target.files){const b=await createImageBitmap(f),k=Math.min(1,1600/Math.max(b.width,b.height)),cv=document.createElement("canvas");cv.width=b.width*k;cv.height=b.height*k;cv.getContext("2d").drawImage(b,0,0,cv.width,cv.height);const blob=await new Promise(r=>cv.toBlob(r,"image/webp",.85)),nm="images/"+slug(f.name)+"-"+Math.random().toString(36).slice(2,6)+".webp";c.items.unshift({title:f.name.replace(/\.[^.]+$/,"").replace(/[-_]+/g," "),img:nm,blob,prev:URL.createObjectURL(blob),status:"available"})}e.target.value="";draw()};
const T=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})(),crc=u=>{let c=-1;for(const b of u)c=T[(c^b)&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){const en=new TextEncoder(),P=[],C=[];let o=0;for(const f of files){const n=en.encode(f.name),c=crc(f.data),L=f.data.length,h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,1);h.setUint16(4,20,1);h.setUint16(6,0x800,1);h.setUint32(14,c,1);h.setUint32(18,L,1);h.setUint32(22,L,1);h.setUint16(26,n.length,1);P.push(h.buffer,n,f.data);const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,1);d.setUint16(4,20,1);d.setUint16(6,20,1);d.setUint16(8,0x800,1);d.setUint32(16,c,1);d.setUint32(20,L,1);d.setUint32(24,L,1);d.setUint16(28,n.length,1);d.setUint32(42,o,1);C.push(d.buffer,n);o+=30+n.length+L}const cs=C.reduce((a,b)=>a+b.byteLength,0),z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,1);z.setUint16(8,files.length,1);z.setUint16(10,files.length,1);z.setUint32(12,cs,1);z.setUint32(16,o,1);return new Blob([...P,...C,z.buffer],{type:"application/zip"})}
const get=async u=>{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error(u);return new Uint8Array(await r.arrayBuffer())};
$("#dl").onclick=async()=>{const m=$("#msg");m.textContent="Preparing…";try{const F=[],en=new TextEncoder(),cats=S.categories.map(c=>({id:c.id,n:c.n,m:c.m,h:c.h,s:c.s,items:c.items.map(({blob,prev,...r})=>r)}));
F.push({name:"index.html",data:await get("index.html")},{name:"admin.html",data:await get("admin.html")},{name:"artworks.json",data:en.encode(JSON.stringify({settings:S.settings,categories:cats},null,1))});
for(const c of S.categories)for(const it of c.items)if(it.img&&!F.some(f=>f.name==it.img))F.push({name:it.img,data:it.blob?new Uint8Array(await it.blob.arrayBuffer()):await get(it.img)});
const a=document.createElement("a");a.href=URL.createObjectURL(zip(F));a.download="hrishika-website.zip";a.click();m.textContent="✔ Downloaded hrishika-website.zip – now drop it on Netlify."}catch(x){m.style.color="#ff8a8a";m.textContent="Error: open this page from your live website (not from a file on your computer). "+x.message}};
fetch("artworks.json",{cache:"no-store"}).then(r=>r.ok?r.json():0).then(d=>{if(d&&d.categories&&d.categories.length){S=d;S.settings=S.settings||{}}}).catch(()=>{}).finally(draw);
</script></body></html>
